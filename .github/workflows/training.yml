name: Auto Training

on:
  workflow_dispatch:
    inputs:
      window_days:
        description: Training window (days)
        required: false
        default: '750'
      step_days:
        description: Step per review (days)
        required: false
        default: '30'
      num_rolls:
        description: Jumlah rolling window
        required: false
        default: '12'

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Extract data
        run: |
          mkdir -p data/historical
          python -c "
import zipfile
with zipfile.ZipFile('forex_data_7years.zip') as z:
    z.extractall('data/historical')
"
      - name: Run training
        run: python -m training_pipeline.main train --rolling --multi-tf --window-days ${{ github.event.inputs.window_days || '750' }} --step-days ${{ github.event.inputs.step_days || '30' }} --num-rolls ${{ github.event.inputs.num_rolls || '12' }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trained-models
          path: models/
          retention-days: 90
      - name: Commit metadata
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add models/*/metadata.json models/*/performance.json models/retrain_counter.json 2>/dev/null || true
          git diff --staged --quiet || { git commit -m "chore: auto-update model metadata [skip ci]"; git push; }
