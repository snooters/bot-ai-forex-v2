name: Auto Training

on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      window_days:
        description: Training window (days)
        required: false
        default: '750'
      step_days:
        description: Step per review (days)
        required: false
        default: '30'
      num_rolls:
        description: Jumlah rolling window
        required: false
        default: '12'

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - run: echo test
