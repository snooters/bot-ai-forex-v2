name: Auto Training

on:
  schedule:
    - cron: '0 2 * * 0'   # tiap Minggu jam 2 pagi
  workflow_dispatch:       # trigger manual dari GitHub UI
    inputs:
      days:
        description: 'Training window (days)'
        required: false
        default: '2555'
      force:
        description: 'Force retrain'
        type: boolean
        default: false

env:
  PYTHON_VERSION: '3.11'

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Setup .env
        run: |
          cp .env.example .env
          echo "HISTORICAL_YEARS=7" >> .env
          echo "ROLLING_TRAINING_WINDOW_DAYS=${{ github.event.inputs.days || '2555' }}" >> .env

      # Data harus diupload sebagai artifact atau dari external source.
      # Contoh: download dari S3/GCS/R2
      # - name: Download training data
      #   run: |
      #     aws s3 sync s3://bucket-name/data/ data/historical/

      - name: Run training
        run: |
          python main.py train --from-storage --all --force \
            --days ${{ github.event.inputs.days || '2555' }}

      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trained-models
          path: models/
          retention-days: 30

      - name: Commit & push models to repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add models/*/metadata.json models/*/performance.json models/retrain_counter.json
          git diff --staged --quiet || git commit -m "chore: auto-update model metadata [skip ci]"
          git push
